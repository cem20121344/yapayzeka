<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .login-card {
            background: #1e293b;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid #334155;
        }

        .login-card h2 {
            margin-bottom: 10px;
            color: #38bdf8;
            font-size: 24px;
        }

        .login-card p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
        }

        button {
            width: 100%;
            padding: 14px;
            background: #38bdf8;
            border: none;
            border-radius: 8px;
            color: #0f172a;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.1s ease;
        }

        button:hover {
            background: #0ea5e9;
        }

        button:active {
            transform: scale(0.98);
        }

        #error-msg {
            color: #f43f5e;
            font-size: 13px;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Yetkili Girişi</h2>
        <p>Devam etmek için şifrenizi girin</p>
        
        <div class="input-group">
            <input type="password" id="passwordBox" placeholder="Şifre" autofocus>
        </div>
        
        <button onclick="checkPassword()">Giriş Yap</button>
        
        <div id="error-msg">Hatalı şifre! Tekrar deneyin.</div>
    </div>

    <script>
        // BURAYA KENDİ İSTEDİĞİN ŞİFREYİ YAZABİLİRSİN
        const DOGRU_SIFRE = "cem2012 13"; 

        function checkPassword() {
            const girilenSifre = document.getElementById("passwordBox").value;
            const errorMsg = document.getElementById("error-msg");

            if (girilenSifre === DOGRU_SIFRE) {
                // Şifre doğruysa oturum açıldığını tarayıcı hafızasına kaydedip ana sayfaya atar
                sessionStorage.setItem("girisYapildi", "true");
                window.location.href = "anasayfa.html";
            } else {
                // Şifre yanlışsa hata gösterir
                errorMsg.style.display = "block";
                document.getElementById("passwordBox").value = "";
                document.getElementById("passwordBox").focus();
            }
        }

        // Klavyeden Enter tuşuna basınca da giriş yapsın
        document.getElementById("passwordBox").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                checkPassword();
            }
        });
    </script>

</body>
</html>
